[project]
name = "web"
version = "0.1.0"
description = ""
authors = [
    {name = "Mateo Drake",email = "mateodrake04@outlook.com.ar"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy-lite (>=0.2.1,<0.3.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "marshmallow (>=4,<5)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "flask-session (>=0.8.0,<0.9.0)",
    "bcrypt (>=5.0.0,<6.0.0)"
]

[tool.poetry]
packages = [{include = "web", from = "src"}]


[tool.poetry.group.test.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
